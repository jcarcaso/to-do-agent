name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install and test server
        working-directory: server
        env:
          MONGODB_URI: mongodb://localhost:27017/todo-test
          JWT_SECRET: test-secret
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
        run: |
          npm ci
          npm test

      - name: Install and build client
        working-directory: client
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            APP_DIR="/home/${{ secrets.EC2_USER }}/to-do-agent"

            # First deploy: clone. Subsequent: pull.
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/jcarcaso/to-do-agent.git "$APP_DIR"
            fi

            # Write production .env
            echo '${{ secrets.ENV_FILE }}' > "$APP_DIR/.env"

            # Run deploy script
            cd "$APP_DIR"
            bash deploy.sh
