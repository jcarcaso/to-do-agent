version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo-api-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongo:27017/todo-agent?authSource=admin
      - JWT_SECRET=dev-secret-change-me
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./server/src:/app/src
      - ./server/logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - app-network
    depends_on:
      - mongo
    command: npx nodemon src/index.js

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: todo-client-dev
    restart: unless-stopped
    volumes:
      - ./client/src:/app/src
    ports:
      - "5173:5173"
    networks:
      - app-network
    command: npm run dev -- --host

  mongo:
    image: mongo:7
    container_name: todo-mongo-dev
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
